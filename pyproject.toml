[project]
name = "prismatica"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "cryptography>=49.0.0",
    "git-filter-repo>=2.47.0",
    "hanlp-restful>=0.0.24",
    "jieba>=0.42.1",
    "loguru>=0.7.3",
    "matplotlib>=3.11.0",
    "mlxtend>=0.25.0",
    "networkx>=3.6.1",
    "nuitka>=4.1.3",
    "olefile>=0.47",
    "openai>=2.46.0",
    "openpyxl",
    "pandas",
    "psutil>=7.2.2",
    "pyperclip>=1.11.0",
    "pycryptodome>=3.23.0",
    "pyside6-fluent-widgets>=1.11.2,<2",
    "python-docx>=1.2.0",
    "requests>=2.34.2",
    "tiktoken>=0.13.0",
    "wordcloud>=1.9.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-qt>=4.4.0",
]
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]
