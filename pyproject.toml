    "bcrypt>=5.0.0",
    "cryptography>=49.0.0",
    "git-filter-repo>=2.47.0",
    "jieba>=0.42.1",
    "loguru>=0.7.3",
    "matplotlib>=3.11.0",
    "mlxtend>=0.25.0",
    "networkx>=3.6.1",
